{% extends "base.html" %}

{% block title %}Edit Task | Task Manager{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Task</h1>
    <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}" class="task-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ task.title }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ task.description or '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="completed" name="completed" {% if task.completed %}checked{% endif %}>
            <label for="completed">Mark as completed</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Task</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
