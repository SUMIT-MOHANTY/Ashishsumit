{% extends "base.html" %}

{% block title %}Todo App{% endblock %}

{% block content %}
    <h1>Todo App</h1>

    <form id="todo-form" action="{{ url_for('add') }}" method="post">
        <div class="input-group mb-3">
            <input type="text" name="title" class="form-control" placeholder="Add a new todo" required>
            <button type="submit" class="btn btn-primary">Add Todo</button>
        </div>
    </form>

    <ul id="todo-list" class="list-group mt-4">
        {% for todo in todos %}
        <li data-id="{{ todo.id }}" class="list-group-item d-flex justify-content-between align-items-center {{ 'list-group-item-success' if todo.completed }}">
            <span class="{{ 'text-decoration-line-through' if todo.completed }}">{{ todo.title }}</span>
            <div>
                <button class="btn btn-sm {{ 'btn-warning' if todo.completed else 'btn-success' }}">
                    {{ 'Mark Undone' if todo.completed else 'Mark Done' }}
                </button>
                <button class="btn btn-sm btn-danger ms-2">Delete</button>
            </div>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
